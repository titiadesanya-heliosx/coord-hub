// ─── DATE HELPERS ────────────────────────────────────────────────────────────
// All date keys stored as "YYYY-MM-DD" in local (UK) time.
// NEVER use .toISOString() — it converts to UTC and can shift the day.

function ds(d){
  // Returns "YYYY-MM-DD" from a Date object using LOCAL time.
  // If already a YYYY-MM-DD string, return as-is.
  if(typeof d==="string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  var dt = (d instanceof Date) ? d : new Date(d);
  var y  = dt.getFullYear();
  var m  = String(dt.getMonth()+1).padStart(2,"0");
  var day= String(dt.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}

function parseDate(str){
  // Parse "YYYY-MM-DD" as LOCAL midnight — avoids UTC shift.
  var p = str.split("-");
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}

function today(){
  var d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()); // local midnight
}

function addD(d,n){
  // Add n days to a date, staying in local time.
  var r = new Date(d);
  r.setDate(r.getDate()+n);
  return new Date(r.getFullYear(), r.getMonth(), r.getDate());
}

function sameD(a,b){ return ds(a)===ds(b); }

function dowMon(d){
  // Day of week where Monday=0, Sunday=6
  var x = new Date(d).getDay();
  return x===0 ? 6 : x-1;
}

function monOf(d){
  // Return the Monday of the week containing d, in local time.
  var r = new Date(d);
  var x = r.getDay();
  r.setDate(r.getDate()+(x===0?-6:1-x));
  return new Date(r.getFullYear(), r.getMonth(), r.getDate());
}

function fmtS(d){ return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function fmtL(d){
  var dt = typeof d==="string" ? parseDate(d) : new Date(d);
  return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}

function bhOnDay(d){ return BH.find(function(b){ return b.date===ds(d); })||null; }

function weekIdx(d){
  // Number of complete weeks since CYCLE_START (both treated as local Monday midnights).
  var ms = monOf(d) - CYCLE_START;
  return Math.max(0, Math.round(ms/(7*864e5)));
}

// Hardcoded shift preferences — these take priority over anything stored in Firebase.
// Edit these arrays to change who is fixed-early or fixed-late.
var FIXED_EARLY = ["roxana","uliana"];
var FIXED_LATE  = ["anastasiya"];

function getShiftForWeek(coord, wi){
  if(FIXED_EARLY.indexOf(coord.id)!==-1) return "early";
  if(FIXED_LATE.indexOf(coord.id)!==-1)  return "late";
  var offsets = {mo:0,jerome:1,erika:2};
  var off = offsets[coord.id]||0;
  return ((wi+off)%6)<3 ? "early" : "late";
}

function isWorkDay(coordId, date){
  var wi = weekIdx(date);
  var pattern = CCYCLE[coordId] && CCYCLE[coordId][wi%3];
  return pattern ? PATTERNS[pattern].indexOf(dowMon(date))!==-1 : false;
}

function calDays(ms){
  var d=[]; var mo=ms.getMonth(); var yr=ms.getFullYear();
  var first=new Date(yr,mo,1); var last=new Date(yr,mo+1,0);
  for(var i=0;i<dowMon(first);i++) d.push(null);
  for(var n=1;n<=last.getDate();n++) d.push(new Date(yr,mo,n));
  return d;
}

// ─── FIREBASE MERGE ──────────────────────────────────────────────────────────
// Safe merge: only fills in missing keys from defaults, never overwrites existing data.
function safeMerge(existing, defaults){
  if(existing===null||existing===undefined) return defaults;
  if(typeof defaults!=="object"||defaults===null) return existing;
  if(Array.isArray(defaults)) return existing; // never overwrite arrays
  var result = Object.assign({}, existing);
  Object.keys(defaults).forEach(function(k){
    if(result[k]===undefined||result[k]===null){
      result[k] = defaults[k];
    } else if(typeof defaults[k]==="object"&&!Array.isArray(defaults[k])){
      result[k] = safeMerge(result[k], defaults[k]);
    }
    // if key already exists and is not an object, keep existing value untouched
  });
  return result;
}

function mkDefault(){

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App(){
  var _st=useState(null);          var st=_st[0];             var setSt=_st[1];

  var _pinErr=useState(false);     var pinErr=_pinErr[0];      var setPinErr=_pinErr[1];
  var _lv=useState(new Date(today().getFullYear(),today().getMonth(),1));
  var lvMo=_lv[0]; var setLvMo=_lv[1];
  var _newPin=useState("");        var newPin=_newPin[0];      var setNewPin=_newPin[1];
  var _pins=useState({});          var pins=_pins[0];          var setPins=_pins[1];
  var _taskEdits=useState(null);   var taskEdits=_taskEdits[0];var setTaskEdits=_taskEdits[1];
  var _swapOpen=useState(false);   var swapOpen=_swapOpen[0];  var setSwapOpen=_swapOpen[1];
  var _swapToCoord=useState("");   var swapToCoord=_swapToCoord[0]; var setSwapToCoord=_swapToCoord[1];
  var _swapDate=useState("");      var swapDate=_swapDate[0];  var setSwapDate=_swapDate[1];
  var _bhSwapOpen=useState(null);  var bhSwapOpen=_bhSwapOpen[0]; var setBhSwapOpen=_bhSwapOpen[1];
  var _bhSwapStep=useState(1);     var bhSwapStep=_bhSwapStep[0]; var setBhSwapStep=_bhSwapStep[1];
  var _bhSwapToCoord=useState(""); var bhSwapToCoord=_bhSwapToCoord[0]; var setBhSwapToCoord=_bhSwapToCoord[1];

  var T = today();

  useEffect(function(){
    var ref = db.ref("coord-hub-v2");
    ref.on("value", function(snap){
      var val = snap.val();
      var def = mkDefault();
      if(!val){
        // First run — write defaults only
        ref.set(def);
        setSt(def);
      } else {
        // Safe merge: never overwrite existing Firebase data with defaults
        var merged = safeMerge(val, def);
        setSt(merged);
        // Initialise pin editor from live data
        var initPins={};
        COORD_DEFS.forEach(function(c){ initPins[c.id]=(merged.coordinators[c.id]||{}).pin||c.pin; });
        setPins(initPins);
      }
      setLoading(false);
    });
    var saved = localStorage.getItem("coord-hub-uid");
    if(saved) setUid(saved);
    return function(){ ref.off(); };
  },[]);

  function flash(msg,type){ setToast({msg:msg,type:type||"ok"}); setTimeout(function(){ setToast(null); },3500); }
  function persist(ns){ return db.ref("coord-hub-v2").set(ns).then(function(){ return true; }).catch(function(){ flash("Save failed — please retry","err"); return false; }); }

  function tryLogin(){
    if(!st) return;
    if(pinInput===st.adminPin){ setUid("admin"); localStorage.setItem("coord-hub-uid","admin"); setTab("rota"); setPinInput(""); return; }
    var c=COORD_DEFS.find(function(x){ return (st.coordinators[x.id]||{}).pin===pinInput||x.pin===pinInput; });
    if(c){ setUid(c.id); localStorage.setItem("coord-hub-uid",c.id); setTab("rota"); setPinInput(""); return; }
    setPinErr(true);
  }
  function logout(){ setUid(null); localStorage.removeItem("coord-hub-uid"); setTab("rota"); setPinInput(""); setPinErr(false); }

  function getCoordShiftOnDate(coord,date){
    var ovr=st&&st.rotaOverrides&&st.rotaOverrides[ds(date)]&&st.rotaOverrides[ds(date)][coord.id];
    if(ovr&&ovr.shift) return ovr.shift;
    return getShiftForWeek(coord,weekIdx(date));
  }

  function getCoordBlockOnDate(coord,date){
    // Check for manual override first
    var ovr=st&&st.rotaOverrides&&st.rotaOverrides[ds(date)]&&st.rotaOverrides[ds(date)][coord.id];
    if(ovr&&ovr.block) return ovr.block;

    // Weekends: only A and B, no C/D cross-cover
    var dow=dowMon(date); // 0=Mon, 6=Sun
    var isWeekend=(dow>=5);

    var wi=weekIdx(date);

    // Get all coordinators working this day, split by shift
    var earlyWorking=coords.filter(function(c){ return isWorking(c.id,date)&&getCoordShiftOnDate(c,date)==="early"; });
    var lateWorking =coords.filter(function(c){ return isWorking(c.id,date)&&getCoordShiftOnDate(c,date)==="late";  });

    // Determine which shift group covers C/D this week (alternates weekly)
    // Even weekIdx = early shift covers C/D, Odd weekIdx = late shift covers C/D
    var cdShift=(wi%2===0)?"early":"late";

    // Within a shift group, sort by COORD_ORDER for stable assignment
    // then alternate A/B (and C/D if applicable) by position in group
    // Position 0 -> A (or C if cross-cover week), Position 1 -> B (or D if cross-cover week)
    // Position 2+ -> back to A/B rotation
    function assignBlock(group, coord, isCDWeek){
      var pos=group.findIndex(function(c){ return c.id===coord.id; });
      if(pos===-1) return "A";
      if(isWeekend||!isCDWeek){
        // Normal week for this shift: A/B only, rotate by (pos + wi)
        return ((pos+wi)%2===0)?"A":"B";
      } else {
        // C/D cross-cover week for this shift: C/D, rotate by (pos + wi)
        return ((pos+wi)%2===0)?"C":"D";
      }
    }

    var shift=getCoordShiftOnDate(coord,date);
    if(shift==="early"){
      return assignBlock(earlyWorking, coord, cdShift==="early");
    } else {
      return assignBlock(lateWorking, coord, cdShift==="late");
    }
  }

  // Returns extra cross-cover context for a coordinator on a date:
  // { hasCrossCover: bool, crossBlock: "A"|"B", primaryBlock: "C"|"D" }
  // On a C/D week, after 16:30 late coords switch to A/B; early coords did C/D 12-16:30 then finish
  function getCrossCoverInfo(coord,date){
    var dow=dowMon(date);
    if(dow>=5) return {hasCrossCover:false};
    var wi=weekIdx(date);
    var cdShift=(wi%2===0)?"early":"late";
    var shift=getCoordShiftOnDate(coord,date);
    var block=getCoordBlockOnDate(coord,date);
    if(shift===cdShift&&(block==="C"||block==="D")){
      // This coord is on C/D cross-cover today
      // Early: works primary block A/B until 12, then C/D 12-16:30
      // Late:  works C/D 12-16:30, then switches to A/B 16:30-21:30
      var lateWorking=coords.filter(function(c){ return isWorking(c.id,date)&&getCoordShiftOnDate(c,date)==="late"; });
      var earlyWorking=coords.filter(function(c){ return isWorking(c.id,date)&&getCoordShiftOnDate(c,date)==="early"; });
      // Find corresponding A/B block (same position in opposite group)
      if(shift==="early"){
        var pos=earlyWorking.findIndex(function(c){ return c.id===coord.id; });
        var abBlock=((pos+wi)%2===0)?"A":"B";
        return {hasCrossCover:true, primaryBlock:block, crossBlock:abBlock, shift:"early"};
      } else {
        var pos2=lateWorking.findIndex(function(c){ return c.id===coord.id; });
        var abBlock2=((pos2+wi)%2===0)?"A":"B";
        return {hasCrossCover:true, primaryBlock:block, crossBlock:abBlock2, shift:"late"};
      }
    }
    return {hasCrossCover:false};
  }

  function isAL(cid,d){
    var key=ds(d);
    return ((st&&st.annualLeave&&st.annualLeave[cid])||[]).indexOf(key)!==-1;
  }

  function toggleAL(cid,date){
    var k=ds(date); // always local YYYY-MM-DD
    var cur=(st.annualLeave[cid]||[]);
    var nxt=cur.indexOf(k)!==-1?cur.filter(function(x){ return x!==k; }):cur.concat([k]).sort();
    persist(Object.assign({},st,{annualLeave:Object.assign({},st.annualLeave,{[cid]:nxt})}));
  }

  function isWorking(coordId,date){
    if(isAL(coordId,date)) return false;
    var bh=bhOnDay(date);
    if(bh){
      var sel=(st&&st.bhSelections&&st.bhSelections[coordId])||[];
      if(sel.indexOf(bh.id)===-1) return false;
    }
    return isWorkDay(coordId,date);
