function ds(d){
  if(typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  var dt=(d instanceof Date)?d:new Date(d);

}

}

// ─── NEW ROTA LOGIC (from 22 June) ───────────────────────────────────────────
function newWeekIdx(d){ return Math.max(0,Math.round((monOf(d)-NEW_CYCLE_START)/(7*864e5))); }

function newIsWorkDay(coord,date){
  // Training coords work every weekday 9-5 until transition
  if(isTrainingPeriod(coord,date)){
    var dow=dowMon(date);
    return dow<5; // Mon-Fri only
  }
  // After transition: everyone works 5 days with pattern based on type and rotation
  // For simplicity all active coords work Mon-Fri plus their weekend rotation
  var dow=dowMon(date);
  var isWeekend=dow>=5;
  if(!isWeekend) return true; // all active coords work weekdays post-transition
  // Weekends: only 1 RW (early) and 1 BPO (late) per day
  var wi=newWeekIdx(date);
  if(coord.type==="rw"){
    // RW weekend: early shift only, rotate all RW coords by weekend index
    var rwAll=["roxana","mo","jerome","daniella"];
    var rwIdx=wi%rwAll.length;
    return rwAll[rwIdx]===coord.id;
  } else {
    var bpoAll=["anastasiya","najma","annemarie"];
    var bpoIdx=wi%bpoAll.length;
    return bpoAll[bpoIdx]===coord.id;
  }
}

function newGetShift(coord,date,wi){
  var dow=dowMon(date);
  var isWeekend=dow>=5;
  // Training period: 09:00-17:00 (shown as training, not early/late)
  if(isTrainingPeriod(coord,date)) return "training";
  if(coord.shiftMode==="fixed-early") return "early";
  if(coord.shiftMode==="fixed-late")  return "late";
  if(isWeekend){
    // RW weekend = early, BPO weekend = late
    return coord.type==="rw"?"early":"late";
  }
  // Rotating weekday logic
  if(coord.type==="rw"){
    // 3-week cycle: week%3 determines who gets early among rotating RW
    var earlyIdx=wi%RW_ROTATING.length;
    return RW_ROTATING[earlyIdx]===coord.id?"early":"late";
  } else {
    // BPO: 2-week cycle
    var bpoEarlyIdx=wi%BPO_ROTATING.length;
    return BPO_ROTATING[bpoEarlyIdx]===coord.id?"early":"late";
  }
}

// ─── SAFE MERGE ───────────────────────────────────────────────────────────────
function safeMerge(existing,defaults){
  if(existing===null||existing===undefined) return defaults;
  if(typeof defaults!=="object"||defaults===null) return existing;
  if(Array.isArray(defaults)) return existing;
  var result=Object.assign({},existing);
  Object.keys(defaults).forEach(function(k){
    if(result[k]===undefined||result[k]===null){
      result[k]=defaults[k];
    } else if(typeof defaults[k]==="object"&&!Array.isArray(defaults[k])){
      result[k]=safeMerge(result[k],defaults[k]);
    }
  });
  return result;
}

function App(){

  var _addType=useState("rw");   var addType=_addType[0]; var setAddType=_addType[1];
  var _addShift=useState("rotate"); var addShift=_addShift[0]; var setAddShift=_addShift[1];
  var _addPin=useState("");      var addPin=_addPin[0];   var setAddPin=_addPin[1];

  var T=today();
  var isNewEra=!isBeforeTransition(T);

  // ─── SET CONTEXT FOR SUB-COMPONENTS ──────────────────────────────────────
  CTX = {
    st:st, uid:uid, T:T, me:me,
    getCoords:getCoords, getAlerts:getAlerts,
    isWorking:isWorking, isAL:isAL,
    bhOnDay:bhOnDay,
    getCoordShiftOnDate:getCoordShiftOnDate,
    getTasksForCoord:getTasksForCoord,
    toggleAL:toggleAL, persist:persist, flash:flash
  };


  useEffect(function(){
    var ref=db.ref("coord-hub-v2");
    ref.on("value",function(snap){
      var val=snap.val();
      var def=mkDefault();
      if(!val){ ref.set(def); setSt(def); }
      else {
        var merged=safeMerge(val,def);
        setSt(merged);
      }
      setLoading(false);
    });
    var saved=localStorage.getItem("coord-hub-uid");
    var savedRole=localStorage.getItem("coord-hub-role");
    if(saved){ setUid(saved); setRole(savedRole); }
    return function(){ ref.off(); };
  },[]);

  function flash(msg,type){ setToast({msg:msg,type:type||"ok"}); setTimeout(function(){ setToast(null); },3500); }
  function persist(ns){ return db.ref("coord-hub-v2").set(ns).then(function(){ return true; }).catch(function(){ flash("Save failed - please retry","err"); return false; }); }

  function tryLogin(){
    if(!st) return;
    if(pinInput===st.adminPin){ setUid("master"); setRole("master"); localStorage.setItem("coord-hub-uid","master"); localStorage.setItem("coord-hub-role","master"); setTab("rota"); setPinInput(""); return; }
    if(pinInput===st.rwAdminPin){ setUid("rwadmin"); setRole("rw"); localStorage.setItem("coord-hub-uid","rwadmin"); localStorage.setItem("coord-hub-role","rw"); setTab("rota"); setPinInput(""); return; }
    if(pinInput===st.bpoAdminPin){ setUid("bpoadmin"); setRole("bpo"); localStorage.setItem("coord-hub-uid","bpoadmin"); localStorage.setItem("coord-hub-role","bpo"); setTab("rota"); setPinInput(""); return; }
    var coords=getCoords();
    var c=coords.find(function(x){ return (st.coordinators[x.id]||{}).pin===pinInput||x.pin===pinInput; });
    if(c){ setUid(c.id); setRole("coord"); localStorage.setItem("coord-hub-uid",c.id); localStorage.setItem("coord-hub-role","coord"); setTab("rota"); setPinInput(""); return; }
    setPinErr(true);
  }
  function logout(){ setUid(null); setRole(null); localStorage.removeItem("coord-hub-uid"); localStorage.removeItem("coord-hub-role"); setTab("rota"); setPinInput(""); setPinErr(false); }

  // ─── COORDINATOR HELPERS ───────────────────────────────────────────────────
  function getCoords(){
    if(!st) return [];
    return Object.values(st.coordinators||{}).filter(function(c){ return c.active!==false; });
  }
  function cById(id){ return getCoords().find(function(c){ return c.id===id; })||DEFAULT_COORDS.find(function(c){ return c.id===id; })||{id:id,name:id}; }

  // ─── SHIFT/WORK LOGIC ─────────────────────────────────────────────────────
  function getCoordShiftOnDate(coord,date){
    var ovr=st&&st.rotaOverrides&&st.rotaOverrides[ds(date)]&&st.rotaOverrides[ds(date)][coord.id];
    if(ovr&&ovr.shift) return ovr.shift;
    if(isBeforeTransition(date)){
      // Legacy: only original 4 coords
      if(!LEGACY_CCYCLE[coord.id]) return null;
      return legacyGetShift(coord,legacyWeekIdx(date));
    }
    if(isTrainingPeriod(coord,date)) return "training";
    return newGetShift(coord,date,newWeekIdx(date));
  }

  function isWorkDay(coord,date){
    if(isBeforeTransition(date)){
      if(!LEGACY_CCYCLE[coord.id]) return false;
      return legacyIsWorkDay(coord.id,date);
    }
    if(!coord.active) return false;
    var startDate=coord.startDate?parseDate(coord.startDate):new Date(2026,0,1);
    if(new Date(date)<startDate) return false;
    return newIsWorkDay(coord,date);
  }

  function isAL(cid,d){ return((st&&st.annualLeave&&st.annualLeave[cid])||[]).indexOf(ds(d))!==-1; }

  function isWorking(coord,date){
    if(isAL(coord.id,date)) return false;
    var bh=bhOnDay(date);
    if(bh){
      var sel=(st&&st.bhSelections&&st.bhSelections[coord.id])||[];
      if(sel.indexOf(bh.id)===-1) return false;
    }
    return isWorkDay(coord,date);
  }

  function toggleAL(cid,date){
    var k=ds(date);
    var cur=(st.annualLeave[cid]||[]);
    var nxt=cur.indexOf(k)!==-1?cur.filter(function(x){return x!==k;}):cur.concat([k]).sort();
    persist(Object.assign({},st,{annualLeave:Object.assign({},st.annualLeave,{[cid]:nxt})}));
  }

  // ─── COVERAGE ─────────────────────────────────────────────────────────────
  function getCoverageForDate(date){
    var coords=getCoords();
    var result={rw:{early:[],late:[]},bpo:{early:[],late:[]}};
    coords.forEach(function(c){
      if(!isWorking(c,date)) return;
      var shift=getCoordShiftOnDate(c,date);
      if(!shift||shift==="training") return;
      var pool=c.type==="bpo"?"bpo":"rw";
      if(result[pool][shift]) result[pool][shift].push(c);
    });
    return result;
  }

  function getAlerts(date){
    var cov=getCoverageForDate(date);
    var dow=dowMon(date);
    var isWeekend=dow>=5;
    var alerts=[];
    if(isBeforeTransition(date)){
      // Legacy alerts: just check total coverage
      var total=cov.rw.early.length+cov.rw.late.length+cov.bpo.early.length+cov.bpo.late.length;
      if(total<2) alerts.push({type:"warn",msg:"Fewer than 2 coordinators scheduled"});
      return alerts;
    }
    // New era alerts
    if(isWeekend){
      if(cov.rw.early.length===0) alerts.push({type:"err",msg:"No R&W early cover (07:00-16:30)"});
      if(cov.bpo.late.length===0)  alerts.push({type:"err",msg:"No BPO late cover (12:00-21:30)"});
    } else {
      if(cov.rw.early.length<2)   alerts.push({type:"warn",msg:"R&W early needs 2 coordinators (have "+cov.rw.early.length+")"});
      if(cov.rw.late.length===0)   alerts.push({type:"err",msg:"No R&W late cover (12:00-21:30)"});
      if(cov.bpo.early.length===0) alerts.push({type:"err",msg:"No BPO early cover (07:00-16:30)"});
      if(cov.bpo.late.length===0)  alerts.push({type:"err",msg:"No BPO late cover (12:00-21:30)"});
    }
    return alerts;
  }

  // ─── TASKS ────────────────────────────────────────────────────────────────
  function getTasksForCoord(coord,date){
    var shift=getCoordShiftOnDate(coord,date);
    if(shift==="training") return [{label:"Training day",tasks:["Shadow your team lead","Review process documentation","Attend scheduled training sessions"]}];
    var dow=dowMon(date);
    var isWeekend=dow>=5;
    var taskDef=coord.type==="bpo"?(st.tasksBPO||DEFAULT_TASKS_BPO):(st.tasksRW||DEFAULT_TASKS_RW);
    var myTasks=[];
    if(isWeekend){
      if(coord.type==="rw"){
        // RW early weekend: own tasks + BPO clinical checks cross-cover
        var rwTasks=(shift==="early"?taskDef.earlyOnly:[]).concat(shift==="late"?taskDef.lateOnly:[]).concat(taskDef.both||[]);
        var bpoClinical=(st.tasksBPO||DEFAULT_TASKS_BPO).weekendOnly||[];
        myTasks.push({label:"Rota & Workflow tasks",tasks:rwTasks});
        myTasks.push({label:"BPO cross-cover (clinical checks)",tasks:bpoClinical,crosscover:true});
      } else {
        // BPO late weekend: clinical checks only + RW cross-cover
        var bpoWeekend=taskDef.weekendOnly||[];
        var rwAll=(shift==="late"?(st.tasksRW||DEFAULT_TASKS_RW).lateOnly:[]).concat((st.tasksRW||DEFAULT_TASKS_RW).both||[]);
        myTasks.push({label:"BPO & Clinical Checks tasks",tasks:bpoWeekend});
        myTasks.push({label:"R&W cross-cover tasks",tasks:rwAll,crosscover:true});
      }
    } else {
      var applicable=(shift==="early"?taskDef.earlyOnly:[]).concat(shift==="late"?taskDef.lateOnly:[]).concat(taskDef.both||[]);
      myTasks.push({label:taskDef.label+" tasks",tasks:applicable});
    }
    return myTasks;
  }

  // ─── BANK HOLIDAYS ────────────────────────────────────────────────────────
  var myBH=(uid&&role==="coord")?((st&&st.bhSelections&&st.bhSelections[uid])||[]):[];
  function bhCov(bhId){ return Object.values((st&&st.bhSelections)||{}).filter(function(a){return Array.isArray(a)&&a.indexOf(bhId)!==-1;}).length; }
  function bhWorkers(bhId){ return getCoords().filter(function(c){return((st&&st.bhSelections&&st.bhSelections[c.id])||[]).indexOf(bhId)!==-1;}); }
  function bhName(id){ var b=BH.find(function(x){return x.id===id;}); return b?b.name:id; }
  function bh3wks(bhId){ var b=BH.find(function(x){return x.id===bhId;}); if(!b) return false; var diff=(parseDate(b.date)-T)/864e5; return diff<21&&diff>0; }

  var reqs=st?Object.values(st.swapRequests||{}):[];
  var inbound=(role==="coord")?reqs.filter(function(r){return r.status==="pending"&&r.toCoordId===uid;}):[];

  if(loading) return React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontSize:14,color:"var(--ts)"}},"Loading...");

  // ─── LOGIN ────────────────────────────────────────────────────────────────
  if(!uid){
    return React.createElement("div",{style:{maxWidth:420,margin:"0 auto",padding:"2rem 1rem"}},
      toast&&React.createElement(Toast,{t:toast}),
      React.createElement("div",{style:{marginBottom:"1.5rem",textAlign:"center"}},
        React.createElement("div",{style:{fontSize:22,fontWeight:500,marginBottom:4}},"Operations Coordinator Hub"),
        React.createElement("div",{style:{fontSize:13,color:"var(--ts)"}},"Enter your PIN to log in")
      ),
      React.createElement("div",{style:{background:"var(--bs)",borderRadius:"var(--rl)",padding:"1.5rem",marginBottom:"1rem"}},
        React.createElement("div",{style:{display:"flex",gap:8,justifyContent:"center",marginBottom:"1rem"}},
          React.createElement("input",{type:"password",maxLength:10,value:pinInput,onChange:function(e){setPinInput(e.target.value);setPinErr(false);},onKeyDown:function(e){if(e.key==="Enter")tryLogin();},placeholder:"Enter PIN",style:{width:160,textAlign:"center",fontSize:18,letterSpacing:4,padding:"10px 14px"},autoFocus:true})
        ),
        pinErr&&React.createElement("div",{style:{textAlign:"center",fontSize:12,color:P.err.tx,marginBottom:8}},"Incorrect PIN. Please try again."),
        React.createElement("button",{onClick:tryLogin,style:Btn(P.adm,{fontWeight:500,fontSize:14,padding:"9px 0",width:"100%"})},"Log in")
      ),
      React.createElement(InfoBox,{text:"Each coordinator and admin has a unique PIN. Contact your admin if you have forgotten yours.",p:P.warn})
    );
  }


  // ─── ADMIN/SUB-ADMIN PANEL ────────────────────────────────────────────────
  var isAdmin=role==="master"||role==="rw"||role==="bpo";

  if(isAdmin){
    var isMaster=role==="master";
    var isRWAdmin=role==="rw"||isMaster;
    var isBPOAdmin=role==="bpo"||isMaster;
    var adminLabel=isMaster?"Master admin":role==="rw"?"R&W Admin":"BPO Admin";
    var adminColor=isMaster?P.adm:role==="rw"?P.rw:P.bpo;
    var coords=getCoords();
    var rwCoords=coords.filter(function(c){return c.type==="rw";});
    var bpoCoords=coords.filter(function(c){return c.type==="bpo";});

    function addCoordinator(){
      if(!addName.trim()){ flash("Please enter a name","err"); return; }
      if(!addPin.trim()||addPin.length<4){ flash("PIN must be at least 4 digits","err"); return; }
      var id=addName.trim().toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9]/g,"");
      if(st.coordinators[id]){ flash("A coordinator with that name already exists","err"); return; }
      var newCoord={id:id,name:addName.trim(),type:addType,shiftMode:addShift,pin:addPin.trim(),active:true,startDate:ds(T)};
      persist(Object.assign({},st,{coordinators:Object.assign({},st.coordinators,{[id]:newCoord})})).then(function(ok){
        if(ok){ flash("Coordinator added"); setAddName(""); setAddPin(""); }
      });
    }

          ((st.annualLeave[uid])||[]).filter(function(d){return parseDate(d)>=T;}).map(function(d){
            return React.createElement("div",{key:d,style:{display:"inline-flex",alignItems:"center",gap:6,padding:"3px 10px",background:P.al.bg,border:"0.5px solid "+P.al.bd,borderRadius:20,fontSize:12,color:P.al.tx}},
              parseDate(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}),
              React.createElement("button",{onClick:function(){toggleAL(uid,parseDate(d));},style:{background:"none",border:"none",cursor:"pointer",fontSize:14,lineHeight:1,padding:0,color:P.al.tx}},"x")
            );
          })
        )
      )
    ),

    tab==="holidays"&&React.createElement("div",null,
      React.createElement(InfoBox,{text:"You need to work 2 bank holidays per year. Max 2 coordinators per bank holiday.",p:P.bh}),
      React.createElement("div",{style:{background:"var(--bs)",borderRadius:"var(--rm)",padding:"0.75rem 1rem",marginBottom:"1rem"}},
        React.createElement("div",{style:{fontSize:13,fontWeight:500,marginBottom:6}},"Your selections ("+myBHLocal.length+"/2)"),
        myBHLocal.length===0
          ?React.createElement("div",{style:{fontSize:13,color:"var(--tt)"}},"None selected yet")
          :myBHLocal.map(function(bhId){
              var bh=BH.find(function(b){return b.id===bhId;});
              return React.createElement("div",{key:bhId,style:{display:"flex",alignItems:"center",gap:8,marginBottom:4,padding:"6px 10px",background:"var(--bp)",border:"0.5px solid "+pal.bd,borderRadius:"var(--rm)"}},
                React.createElement("span",{style:{flex:1,fontSize:13,fontWeight:500}},bh&&bh.name),
                React.createElement("span",{style:{fontSize:12,color:"var(--ts)"}},bh&&fmtL(bh.date)),
                !bh3wks(bhId)&&React.createElement("button",{onClick:function(){
                  if(bh3wks(bhId)){flash("Within 3 weeks - contact your admin to swap","warn");return;}
                  persist(Object.assign({},st,{bhSelections:Object.assign({},st.bhSelections,{[uid]:myBHLocal.filter(function(i){return i!==bhId;})})})).then(function(ok){if(ok)flash("Bank holiday removed");});
                },style:Btn(P.err,{fontSize:12})},"Remove")
              );
            }),
        myBHLocal.length<2&&React.createElement("div",{style:{fontSize:12,color:"var(--ts)",marginTop:4}},"Select "+(2-myBHLocal.length)+" more from below")
      ),
      BH.map(function(bh){
        var past=parseDate(bh.date)<T;
        var cov=bhCov(bh.id);
        var isMine=myBHLocal.indexOf(bh.id)!==-1;
        var full=cov>=2;
        var canSelect=!past&&!isMine&&myBHLocal.length<2&&!full;
        return React.createElement("div",{key:bh.id,style:{padding:"0.75rem 1rem",background:"var(--bp)",border:"0.5px solid "+(isMine?pal.bd:full&&!past?P.err.bd:"var(--bt2)"),borderRadius:"var(--rm)",marginBottom:6,opacity:past?0.5:1}},
          React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
            React.createElement("div",{style:{flex:"0 0 200px"}},
              React.createElement("div",{style:{fontSize:13,fontWeight:500}},bh.name),
              React.createElement("div",{style:{fontSize:12,color:"var(--ts)"}},fmtL(bh.date))
            ),
            React.createElement("div",{style:{flex:1,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},
              bhWorkers(bh.id).map(function(w){return React.createElement(Pill,{key:w.id,label:w.name,p:typeP(w.type)});}),
              !past&&React.createElement(Pill,{label:cov+"/2 slots filled",p:cov>=2?P.err:cov===1?P.warn:P.ok})
            ),
            !past&&(isMine
              ?React.createElement(Pill,{label:"Selected",p:pal})
              :canSelect
                ?React.createElement("button",{onClick:function(){
                    if(myBHLocal.length>=2){flash("You have already selected 2 bank holidays","err");return;}
                    if(bhCov(bh.id)>=2){flash("This bank holiday is already fully covered","err");return;}
                    persist(Object.assign({},st,{bhSelections:Object.assign({},st.bhSelections,{[uid]:myBHLocal.concat([bh.id])})})).then(function(ok){if(ok)flash("Bank holiday selected");});
                  },style:Btn(pal,{fontWeight:500,fontSize:12})},"+  Select")
                :full?React.createElement("span",{style:{fontSize:12,color:P.err.tx,fontWeight:500}},"Full"):null
            )
          )
        );
      })
    ),

    tab==="team"&&React.createElement("div",null,
      React.createElement(InfoBox,{text:"Your team overview.",p:P.adm}),
      React.createElement("div",{style:{marginBottom:"1rem"}},
        React.createElement(SecLabel,null,"Rota & Workflow"),
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8}},
          getCoords().filter(function(c){return c.type==="rw";}).map(function(coord){
            var isMe=coord.id===uid;
            var shift=getCoordShiftOnDate(coord,T);
            var leave=((st.annualLeave[coord.id])||[]).filter(function(d){return parseDate(d)>=T;}).slice(0,2);
            return React.createElement("div",{key:coord.id,style:{padding:"0.75rem",background:"var(--bp)",border:"0.5px solid "+(isMe?pal.bd:P.rw.bd),borderRadius:"var(--rm)"}},
              React.createElement("div",{style:{fontWeight:500,fontSize:13,marginBottom:4}},coord.name+(isMe?" (you)":"")),
              React.createElement("div",{style:{fontSize:11,color:"var(--ts)",marginBottom:2}},shift?shift+" shift":"Not working today"),
              leave.length>0&&leave.map(function(d){return React.createElement("div",{key:d,style:{fontSize:11,color:P.al.tx}},parseDate(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}));})
            );
          })
        )
      ),
      React.createElement("div",null,
        React.createElement(SecLabel,null,"BPO & Clinical Checks"),
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8}},
          getCoords().filter(function(c){return c.type==="bpo";}).map(function(coord){
            var isMe=coord.id===uid;
            var shift=getCoordShiftOnDate(coord,T);
            var leave=((st.annualLeave[coord.id])||[]).filter(function(d){return parseDate(d)>=T;}).slice(0,2);
            return React.createElement("div",{key:coord.id,style:{padding:"0.75rem",background:"var(--bp)",border:"0.5px solid "+(isMe?pal.bd:P.bpo.bd),borderRadius:"var(--rm)"}},
              React.createElement("div",{style:{fontWeight:500,fontSize:13,marginBottom:4}},coord.name+(isMe?" (you)":"")),
              React.createElement("div",{style:{fontSize:11,color:"var(--ts)",marginBottom:2}},shift?shift+" shift":"Not working today"),
              leave.length>0&&leave.map(function(d){return React.createElement("div",{key:d,style:{fontSize:11,color:P.al.tx}},parseDate(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}));})
            );
          })
        )
      )
    ),

    tab==="pin"&&React.createElement("div",null,
      React.createElement(InfoBox,{text:"Change your PIN here. You will need your new PIN next time you log in. Your manager cannot see your PIN - only reset it.",p:P.warn}),
      React.createElement("div",{style:{maxWidth:320}},
        React.createElement("div",{style:{marginBottom:12}},
          React.createElement("div",{style:{fontSize:12,color:"var(--ts)",marginBottom:4}},"New PIN (4-6 digits)"),
          React.createElement("input",{type:"password",maxLength:6,value:newPin,onChange:function(e){setNewPin(e.target.value);},placeholder:"Enter new PIN",style:{width:"100%"}})
        ),
        React.createElement("button",{onClick:function(){
          if(!newPin.trim()||newPin.length<4){flash("PIN must be at least 4 digits","err");return;}
          var c2=Object.assign({},st.coordinators);
          c2[uid]=Object.assign({},c2[uid],{pin:newPin.trim()});
          persist(Object.assign({},st,{coordinators:c2})).then(function(ok){if(ok){flash("PIN updated successfully");setNewPin("");}});
        },style:Btn(P.adm,{fontWeight:500,padding:"8px 20px"})},"Update PIN")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
