function ds(d){ return new Date(d).toISOString().slice(0,10); }
function addD(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }

function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function parseDate(str){
  // Parse YYYY-MM-DD as local time to avoid UTC timezone shift
  var p = str.split("-");
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}
function fmtS(d){ return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }
function fmtL(d){
  var dt = typeof d === "string" ? parseDate(d) : new Date(d);
  return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}
function bhOnDay(d){ return BH.find(function(b){ return b.date===ds(d); }) || null; }
function weekIdx(d){ var ms=monOf(d)-CYCLE_START; return Math.max(0,Math.round(ms/(7*864e5))); }

function getShiftForWeek(coord, wkIdx){
  if(coord.shiftMode==="fixed-early") return "early";
  if(coord.shiftMode==="fixed-late")  return "late";
  var offsets = {uliana:0,mo:1,jerome:2,erika:3};
  var off = offsets[coord.id] || 0;
  return ((wkIdx+off)%6)<3 ? "early" : "late";
}

function isWorkDay(coordId, date){
  var p = CCYCLE[coordId] && CCYCLE[coordId][weekIdx(date)%3];
  return p ? PATTERNS[p].indexOf(dowMon(date)) !== -1 : false;
}

function calDays(ms){
  var d=[]; var mo=ms.getMonth(); var yr=ms.getFullYear();
  var first=new Date(yr,mo,1); var last=new Date(yr,mo+1,0);
  for(var i=0;i<dowMon(first);i++) d.push(null);
  for(var n=1;n<=last.getDate();n++) d.push(new Date(yr,mo,n));
  return d;
}

  var _newPin = useState(""); var newPin = _newPin[0]; var setNewPin = _newPin[1];
  var _pins = useState({}); var pins = _pins[0]; var setPins = _pins[1];

  var _swapOpen = useState(false); var swapOpen = _swapOpen[0]; var setSwapOpen = _swapOpen[1];

      props.coords.filter(function(c){ return ((props.st.bhSelections[c.id])||[]).indexOf(props.bh.id)===-1; }).map(function(c){ return React.createElement("option",{key:c.id,value:c.id}, c.name); })
    ),
    React.createElement("button",{onClick:addCoord,style:Btn(P.ok,{fontSize:12})}, "+ Add"),
    Object.entries(props.st.bhSelections||{}).filter(function(entry){ return entry[1].indexOf(props.bh.id)!==-1; }).map(function(entry){
      var cid=entry[0];
      var coord=props.coords.find(function(c){ return c.id===cid; });
      return React.createElement("div",{key:cid,style:{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",background:P.err.bg,border:"0.5px solid "+P.err.bd,borderRadius:20,fontSize:12,color:P.err.tx}},
        coord&&coord.name,
        React.createElement("button",{onClick:function(){ removeCoord(cid); },style:{background:"none",border:"none",cursor:"pointer",color:P.err.tx,fontSize:13,padding:0,lineHeight:1}}, "x")
      );
    })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
